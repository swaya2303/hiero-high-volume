# Publish to npm and create a GitHub Release when a version tag is pushed.
# Trigger by running: git tag v0.1.0 && git push origin v0.1.0

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # Required for creating GitHub Releases

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed for changelog generation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          # Points npm publish at the official npm registry
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
